name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install Bubblewrap CLI
        run: npm i -g @bubblewrap/cli

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERRORE: manca il secret KEYSTORE_BASE64 (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          ls -l android.keystore

      - name: Build APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          bubblewrap build \
            --manifest=twa-manifest.json \
            --skipPwaValidation \
            --apkSigningKeyPath=android.keystore \
            --apkSigningKeyPassword="$KEYSTORE_PASSWORD"

      - name: Raccogli output
        run: |
          mkdir -p dist
          find . -path ./node_modules -prune -o \( -name "*.apk" -o -name "*.aab" \) -print | while read f; do cp "$f" dist/; done
          rm -f android.keystore
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-converter-pro-android
          path: dist/

      - name: Crea Release su GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
